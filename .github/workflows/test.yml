name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml gates the release on this

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pytest with coverage
        run: uv run pytest --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## 🧪 Test coverage'
            echo '```'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
